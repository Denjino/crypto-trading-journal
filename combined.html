const formatCurrency = (value, decimals = 2) => {
    const num = parseFloat(value);
    if (isNaN(num)) return '$0.00';
    return new Intl.NumberFormat('en-US', {
        style: 'currency', currency: 'USD',
        minimumFractionDigits: decimals, maximumFractionDigits: decimals,
    }).format(num);
};

const formatPercent = (value, decimals = 2) => {
    const num = parseFloat(value);
    if (isNaN(num)) return '0.00%';
    return `${num >= 0 ? '+' : ''}${num.toFixed(decimals)}%`;
};

const formatNumber = (value, decimals = 4) => {
    const num = parseFloat(value);
    if (isNaN(num)) return '0';
    return num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: decimals });
};

    if (saved) {

const HyperliquidService = {
    async fetchMeta() {
        try {
            const response = await fetch(HYPERLIQUID_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: 'metaAndAssetCtxs' }),
            });
            return await response.json();
        } catch (error) {
            console.error('Failed to fetch meta:', error);
            return null;
        }
    },
    async fetchAllMids() {
        try {
            const response = await fetch(HYPERLIQUID_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: 'allMids' }),
            });
            return await response.json();
        } catch (error) {
            console.error('Failed to fetch mids:', error);
            return {};
        }
    },
};

// ============================================
// CUSTOM HOOKS
// ============================================
const useMarketData = () => {
    const [tickers, setTickers] = useState([]);
    const [prices, setPrices] = useState({});
    const [loading, setLoading] = useState(true);
    const intervalRef = useRef(null);

    const fetchData = useCallback(async () => {
        try {
            const [metaData, midsData] = await Promise.all([
                HyperliquidService.fetchMeta(),
                HyperliquidService.fetchAllMids(),
            ]);
            if (metaData && metaData[0]?.universe) {
                const tickerList = metaData[0].universe
                    .filter(asset => !asset.isDelisted)
                    .map((asset, index) => ({
                        symbol: asset.name,
                        szDecimals: asset.szDecimals,
                        maxLeverage: asset.maxLeverage,
                        index,
                    }));
                setTickers(tickerList);
            }
            if (midsData) setPrices(midsData);
        } catch (error) {
            console.error('Error fetching market data:', error);
        } finally {
            setLoading(false);
        }
    }, []);

    useEffect(() => {
        fetchData();
        intervalRef.current = setInterval(fetchData, 5000);
        return () => clearInterval(intervalRef.current);
    }, [fetchData]);

    return { tickers, prices, loading, refetch: fetchData };
};

const useTiltDetection = (trades, settings) => {
    return useMemo(() => {
        const warnings = [];
        const openTrades = trades.filter(t => t.status === 'open');
        const closedTrades = trades.filter(t => t.status === 'closed');

        const totalOpenRisk = openTrades.reduce((sum, t) => sum + (t.riskPercent || 0), 0);
        if (totalOpenRisk > settings.maxTotalOpenRisk) {
            warnings.push({
                type: 'high-exposure', severity: 'critical',
                message: `Total open risk (${totalOpenRisk.toFixed(1)}%) exceeds maximum (${settings.maxTotalOpenRisk}%)`,
                suggestion: 'Consider closing some positions to reduce exposure',
            });
        }

        const recentClosed = closedTrades.slice(-10);
        let consecutiveLosses = 0;
        for (let i = recentClosed.length - 1; i >= 0; i--) {
            if (recentClosed[i].pnl < 0) consecutiveLosses++;
            else break;
        }
        if (consecutiveLosses >= settings.consecutiveLossesAlert) {
            warnings.push({
                type: 'losing-streak', severity: 'warning',
                message: `${consecutiveLosses} consecutive losing trades detected`,
                suggestion: 'Take a break, review your strategy, and avoid revenge trading',
            });
        }

        if (closedTrades.length >= 3) {
            const lastThree = closedTrades.slice(-3);
            const allLosses = lastThree.every(t => t.pnl < 0);
            const increasingSizes = lastThree.every((t, i) => i === 0 || t.positionSize > lastThree[i-1].positionSize);
            if (allLosses && increasingSizes) {
                warnings.push({
                    type: 'revenge-trading', severity: 'critical',
                    message: 'Revenge trading pattern detected: increasing sizes after losses',
                    suggestion: 'Stop trading immediately. Take at least 1 hour break.',
                });
            }
        }

        const now = Date.now();
        const windowMs = TILT_THRESHOLDS.tradingFrequencyWindow * 60 * 1000;
        const recentTrades = trades.filter(t => new Date(t.entryTime).getTime() > now - windowMs);
        if (recentTrades.length >= TILT_THRESHOLDS.maxTradesInWindow) {
            warnings.push({
                type: 'overtrading', severity: 'warning',
                message: `${recentTrades.length} trades in the last ${TILT_THRESHOLDS.tradingFrequencyWindow} minutes`,
                suggestion: 'Slow down. Quality over quantity.',
            });
        }

        const lowConfHighRisk = openTrades.filter(t => t.confidence <= 2 && t.riskPercent > 1);
        if (lowConfHighRisk.length > 0) {
            warnings.push({
                type: 'confidence-risk-mismatch', severity: 'warning',
                message: `${lowConfHighRisk.length} trade(s) with low confidence but high risk`,
                suggestion: 'Reduce position size on low confidence trades',
            });
        }

        return warnings;
    }, [trades, settings]);
};

// Trade Calculator
const TradeCalculator = ({ formData, settings, openTrades }) => {
    const calculations = useMemo(() => {
        const { entry, stopLoss, takeProfit, positionSize, leverage, direction } = formData;
        const accountBalance = settings.accountBalance;
        
        const entryPrice = parseFloat(entry) || 0;
        const sl = parseFloat(stopLoss) || 0;
        const tp = parseFloat(takeProfit) || 0;
        const size = parseFloat(positionSize) || 0;
        
        if (!entryPrice || !sl || !size) return null;

        const positionValue = size * entryPrice;
        const positionPercent = (positionValue / accountBalance) * 100;
        const riskPerUnit = direction === 'long' ? entryPrice - sl : sl - entryPrice;
        const riskDollar = Math.abs(riskPerUnit * size);
        const riskPercent = (riskDollar / accountBalance) * 100;
        const rewardPerUnit = tp ? (direction === 'long' ? tp - entryPrice : entryPrice - tp) : 0;
        const rewardDollar = Math.abs(rewardPerUnit * size);
        const rewardPercent = (rewardDollar / accountBalance) * 100;
        const rrRatio = riskDollar > 0 ? rewardDollar / riskDollar : 0;
        const currentOpenRisk = openTrades.filter(t => t.status === 'open').reduce((sum, t) => sum + (t.riskPercent || 0), 0);
        const currentOpenRiskDollar = openTrades.filter(t => t.status === 'open').reduce((sum, t) => sum + (t.riskDollar || 0), 0);
        const totalRiskPercent = currentOpenRisk + riskPercent;
        const totalRiskDollar = currentOpenRiskDollar + riskDollar;

        return { positionValue, positionPercent, riskDollar, riskPercent, rewardDollar, rewardPercent, rrRatio, currentOpenRisk, currentOpenRiskDollar, totalRiskPercent, totalRiskDollar };
    }, [formData, settings, openTrades]);

    if (!calculations) {

            style: { background: 'var(--bg-tertiary)', borderRadius: '12px', padding: '20px', border: '1px solid var(--border-subtle)' }

        );
    }

    const isHighRisk = calculations.riskPercent > settings.maxRiskPerTrade;
    const isTotalRiskHigh = calculations.totalRiskPercent > settings.maxTotalOpenRisk;

    const CalcRow = ({ label, value, subValue, color, warning }) => (

    const winningTrades = closedTrades.filter(t => t.pnl > 0);
    const winRate = closedTrades.length > 0 ? (winningTrades.length / closedTrades.length * 100) : 0;
    const totalOpenRisk = openTrades.reduce((sum, t) => sum + (t.riskPercent || 0), 0);
    const totalOpenRiskDollar = openTrades.reduce((sum, t) => sum + (t.riskDollar || 0), 0);

const ActiveTradesScreen = ({ trades, prices, onCloseTrade, settings }) => {

        const currentPrice = parseFloat(prices[trade.symbol]);
        if (currentPrice) handleConfirmClose(trade, currentPrice);

    const handleConfirmClose = (trade, price) => {
        const priceDiff = trade.direction === 'long' ? price - trade.entry : trade.entry - price;
        const pnl = priceDiff * trade.positionSize;
        onCloseTrade(trade.id, { exitPrice: price, pnl, exitTime: new Date().toISOString(), status: 'closed' });
        setClosingTrade(null);
        setExitPrice('');

        const currentPrice = parseFloat(prices[trade.symbol]) || trade.entry;

        return sum + (priceDiff * trade.positionSize);

                                React.createElement('span', { style: { padding: '3px 10px', borderRadius: '5px', fontSize: '11px', fontWeight: '600', background: trade.direction === 'long' ? 'var(--accent-green-dim)' : 'var(--accent-red-dim)', color: trade.direction === 'long' ? 'var(--accent-green)' : 'var(--accent-red)' } }, trade.direction.toUpperCase() + ' ' + trade.leverage + 'x'),
                                React.createElement('span', { style: { padding: '3px 10px', borderRadius: '5px', fontSize: '11px', background: 'var(--accent-orange-dim)', color: 'var(--accent-orange)' } }, 'Risk: ' + trade.riskPercent.toFixed(1) + '%')
                            ),

                })
            )

};

// ============================================
// MAIN APP COMPONENT
// ============================================
const App = () => {
    const [currentScreen, setCurrentScreen] = useState('dashboard');
    const [state, setState] = useState(getInitialState);
    const { tickers, prices, loading } = useMarketData();
    const tiltWarnings = useTiltDetection(state.trades, state.settings);

    // Save state to localStorage
    useEffect(() => {
        localStorage.setItem('cryptoJournalState', JSON.stringify(state));
    }, [state]);

    const handleAddTrade = useCallback((trade) => {
        setState(prev => ({ ...prev, trades: [...prev.trades, trade] }));
        setCurrentScreen('active');
    }, []);

    const handleCloseTrade = useCallback((tradeId, closeData) => {
        setState(prev => ({
            ...prev,
            trades: prev.trades.map(t => t.id === tradeId ? { ...t, ...closeData } : t)
        }));
    }, []);

    const handleEditTrade = useCallback((tradeId, updates) => {
        setState(prev => ({
            ...prev,
            trades: prev.trades.map(t => t.id === tradeId ? { ...t, ...updates } : t)
        }));
    }, []);

    const handleUpdateSettings = useCallback((newSettings) => {
        setState(prev => ({ ...prev, settings: newSettings }));
    }, []);

    const renderScreen = () => {
        switch (currentScreen) {
            case 'dashboard':
                return React.createElement(DashboardScreen, { trades: state.trades, settings: state.settings, prices, tiltWarnings });
            case 'new-trade':
                return React.createElement(NewTradeScreen, { onSubmit: handleAddTrade, tickers, prices, settings: state.settings, openTrades: state.trades });
            case 'active':
                return React.createElement(ActiveTradesScreen, { trades: state.trades, prices, onCloseTrade: handleCloseTrade, settings: state.settings });
            case 'closed':
                return React.createElement(ClosedTradesScreen, { trades: state.trades, onEditTrade: handleEditTrade });
            case 'settings':
                return React.createElement(SettingsScreen, { settings: state.settings, onUpdateSettings: handleUpdateSettings, trades: state.trades });
            default:
                return null;
        }
    };

    const screenTitles = {
        'dashboard': 'Dashboard',
        'new-trade': 'New Trade',
        'active': 'Active Trades',
        'closed': 'Closed Trades',
        'settings': 'Settings'
    };

    return React.createElement('div', { style: { display: 'flex', minHeight: '100vh' } },
        React.createElement(Sidebar, { currentScreen, setCurrentScreen }),
        React.createElement('main', { style: { flex: 1, marginLeft: '220px', padding: '24px 32px', background: 'var(--bg-primary)' } },
            // Header
            React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px' } },
                React.createElement('h1', { style: { fontSize: '22px', fontWeight: '600' } }, screenTitles[currentScreen]),
                React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '12px' } },
                    loading
                        ? React.createElement('span', { style: { fontSize: '12px', color: 'var(--text-muted)' } }, 'Loading prices...')
                        : React.createElement('span', { style: { display: 'flex', alignItems: 'center', gap: '6px', fontSize: '12px', color: 'var(--accent-green)' } },
                            React.createElement('span', { style: { width: '6px', height: '6px', borderRadius: '50%', background: 'var(--accent-green)', animation: 'pulse 2s ease-in-out infinite' } }),
                            'Live'
                        ),
                    React.createElement('span', { style: { fontSize: '12px', color: 'var(--text-muted)' } }, new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }))
                )
            ),
            // Content
            renderScreen()
        )
    );
};

// Render App
ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
